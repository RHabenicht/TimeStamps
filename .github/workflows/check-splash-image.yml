name: Verify repository splash PNG identity
on:
  push:
    paths:
      - 'ci/png-fingerprint.go'
      - '.github/workflows/check-splash-image.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
      - name: Print exact decoded RGBA pixel SHA256
        run: go run ci/png-fingerprint.go
