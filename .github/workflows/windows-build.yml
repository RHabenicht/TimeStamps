name: Windows build and installer tests
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
      - name: Build and test
        shell: pwsh
        run: ./BUILD_RELEASE.ps1
      - name: Check generated executables
        shell: pwsh
        run: |
          foreach ($file in @('TimeStamps.exe','Uninstall-TimeStamps.exe','TimeStamps_2.5_Setup_Updated_by_NightLife.exe')) {
            if (!(Test-Path (Join-Path dist $file))) {throw "Missing $file"}
          }
      - name: Verify splash artwork is actually rendered to pixels
        shell: pwsh
        run: .\ci\diagnose-splash-v25.ps1
      - name: Run candidate installer, application, Format regression and uninstaller
        shell: pwsh
        run: .\ci\windows-install-smoke-v25.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: TimeStamps-2.5-Windows
          path: |
            dist/TimeStamps.exe
            dist/Uninstall-TimeStamps.exe
            dist/TimeStamps_2.5_Setup_Updated_by_NightLife.exe
      - name: Refresh published TimeStamps 2.5 installer
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v2.5 --json tagName | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'TimeStamps 2.5 release is missing' }
          gh release upload v2.5 'dist/TimeStamps_2.5_Setup_Updated_by_NightLife.exe' 'dist/TimeStamps.exe' 'dist/Uninstall-TimeStamps.exe' --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Updating TimeStamps 2.5 assets failed' }
          gh release edit v2.5 --title 'TimeStamps 2.5 — Updated by NightLife' --notes 'Refreshed TimeStamps 2.5 build. Splash foreground handling and startup diagnostics are included. Windows Go tests, painted splash pixels, install/upgrade, Format navigation, generation and uninstall checks passed. Executables are unsigned. The owner PC, Windows 10, Norton 360 and 1360x768 at 125 percent have not been independently tested.'
          if ($LASTEXITCODE -ne 0) { throw 'Updating TimeStamps 2.5 release notes failed' }
