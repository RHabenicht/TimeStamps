name: Windows build and installer tests
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
      - name: Build and test
        shell: pwsh
        run: ./BUILD_RELEASE.ps1
      - name: Check generated executables
        shell: pwsh
        run: |
          foreach ($file in @('TimeStamps.exe','Uninstall-TimeStamps.exe','TimeStamps_2.5.1_Setup_Updated_by_NightLife.exe')) {
            if (!(Test-Path (Join-Path dist $file))) {throw "Missing $file"}
          }
      - name: Verify splash artwork is actually rendered to pixels
        shell: pwsh
        run: .\ci\diagnose-splash-v251.ps1
      - name: Run candidate installer, application, Format regression and uninstaller
        shell: pwsh
        run: .\ci\windows-install-smoke-v251.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: TimeStamps-2.5.1-Windows
          path: |
            dist/TimeStamps.exe
            dist/Uninstall-TimeStamps.exe
            dist/TimeStamps_2.5.1_Setup_Updated_by_NightLife.exe
      - name: Publish TimeStamps 2.5.1 installer release
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $existing = gh release list --limit 100 --json tagName --jq '.[] | select(.tagName == "v2.5.1") | .tagName'
          if ($LASTEXITCODE -ne 0) { throw 'Unable to query existing releases' }
          if ($existing -eq 'v2.5.1') {
            Write-Host 'Release v2.5.1 already exists; leaving published binaries unchanged.'
          } else {
            gh release create v2.5.1 'dist/TimeStamps_2.5.1_Setup_Updated_by_NightLife.exe' 'dist/TimeStamps.exe' 'dist/Uninstall-TimeStamps.exe' --target "$env:GITHUB_SHA" --title 'TimeStamps 2.5.1 — Updated by NightLife' --notes 'Windows 10/11 (64-bit) installer and portable application. Includes NightLife serpent icon and four-second splash screen. CI compilation, Go tests, package checks: passed. Hosted Windows runtime install, GDI artwork pixels, 15 Format transitions, and uninstall tests passed. The physical display used by the owner and Norton 360 were not tested. Executables are unsigned.'
            if ($LASTEXITCODE -ne 0) { throw 'Release creation failed' }
          }
