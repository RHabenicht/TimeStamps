name: One-time approved full splash update for TimeStamps 2.5
on:
  push:
    paths:
      - '.github/workflows/publish-full-splash-v25-once.yml'
jobs:
  update-v25:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Retrieve successfully tested original-artwork build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          test "$(gh run view 42649970586 --json conclusion --jq .conclusion)" = "success"
          test "$(gh run view 42649970586 --json headSha --jq .headSha)" = "5bb170f9cdc4e1f13ecf0c44df2361e554c26390"
          gh run download 42649970586 --name 'TimeStamps-2.5-Windows' --dir dist
          test -s 'dist/TimeStamps_2.5_Setup_Updated_by_NightLife.exe'
          test -s 'dist/TimeStamps.exe'
          test -s 'dist/Uninstall-TimeStamps.exe'
          sha256sum dist/*.exe
      - name: Publish corrected original six-second artwork under existing v2.5 release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view v2.5 --json tagName
          gh release upload v2.5 'dist/TimeStamps_2.5_Setup_Updated_by_NightLife.exe' 'dist/TimeStamps.exe' 'dist/Uninstall-TimeStamps.exe' --clobber
          gh release edit v2.5 --title 'TimeStamps 2.5 — Updated by NightLife' --latest --notes 'Windows 10/11 64-bit. Shows exactly the approved full NightLife TimeStamps splash art (1672 x 941 image, no added serpent icon) for six seconds before the main window. Verified decoded image matches supplied reference pixel-for-pixel with SHA256 f1311c993d8286e64151c090799e3733904191fdc00d8fffd2c92fc921c343e1. Windows runner tests passed for paint colors, startup timing, install/upgrade, format navigation, generation, and uninstall. Physical owner machine and Norton 360 behavior remain unverified. Unsigned freeware. One-time tested replacement; automatic release overwrites disabled.'
          gh release view v2.5 --json assets --jq '.assets[].name'
